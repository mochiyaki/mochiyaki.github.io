<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Pig City Run</title>
  <script type="module" crossorigin src="index.js"></script>
  <link rel="stylesheet" crossorigin href="index.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <section id="hud" aria-label="Game status">
            <div class="hud-title">Safety Pig City Run</div>
            <div class="stat-line">
                <span>Gear</span>
                <strong id="gear-progress">0/6</strong>
            </div>
            <div class="health-wrap">
                <div class="stat-line">
                    <span>Safety</span>
                    <strong>100</strong>
                </div>
                <div id="health-bar">
                    <div id="health-fill"></div>
                </div>
            </div>
            <div id="inventory-list"></div>
        </section>

        <section id="controls-info" aria-label="Controls">
            <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</p>
            <p><kbd>E</kbd> pick up gear</p>
            <p><kbd>Mouse drag</kbd> camera</p>
            <p><kbd>Wheel</kbd> zoom</p>
            <p><kbd>R</kbd> restart after game end</p>
        </section>

        <div id="notice" class="hidden" role="status"></div>

        <button id="restart-button" type="button">Restart</button>
    </div>

</body>
</html>
