<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Analysis Studio 🎙️</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: '#1a1a2e',
            navyDeep: '#0d1117',
            teal: '#0f9690',
            tealLight: '#16a085',
            coral: '#e74c3c',
            coralSoft: '#e67e73',
            surface: '#f8f9fa',
            surfaceDark: '#161b22',
            cardDark: '#1c2333',
          },
          fontFamily: {
            sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-surface dark:bg-navyDeep transition-colors duration-300">
  <div id="root"></div>
  <script src="index.js"></script>
</body>
</html>
